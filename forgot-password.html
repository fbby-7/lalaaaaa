<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d14">
<title>Forgot Password | Fullbright College</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080d14;--panel:#101b26;--field:#09121b;--line:#26394b;--text:#e8eef6;--muted:#91a4b6;--accent:#28a9e0;--btn:#172737;--good:#0d352e;--bad:#7f1d1d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#122b3c 0,transparent 35%),var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}.wrap{width:min(100%,460px)}.brand{display:flex;align-items:center;gap:13px;margin-bottom:22px}.logo{width:58px;height:58px;border-radius:15px;object-fit:cover}.brand h1{font-size:20px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.card{background:linear-gradient(145deg,#111e2a,#0d151f);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 24px 70px #0007}.card h2{font-size:23px;margin:0 0 9px}.sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 24px}.field{margin-bottom:18px}.field label{display:block;font-size:13px;font-weight:700;color:#b8c7d5;margin-bottom:8px}.field input{width:100%;border:1px solid var(--line);outline:0;background:var(--field);color:var(--text);border-radius:13px;padding:15px;font:inherit}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #28a9e033}.btn{width:100%;border:1px solid #31506a;background:linear-gradient(100deg,#71d1f4,#28b6eb);color:#06111b;font:inherit;font-weight:800;border-radius:12px;padding:14px;cursor:pointer}.btn.secondary{background:var(--btn);color:var(--text);margin-top:10px}.btn:disabled{opacity:.65;cursor:wait}.status{display:none;border-radius:10px;padding:12px 14px;margin:0 0 18px;font-size:13px;line-height:1.5}.status.show{display:block}.status.good{background:var(--good);color:#a7f3d0}.status.bad{background:var(--bad);color:#fee2e2}.back{display:block;text-align:center;margin-top:19px;color:#8cccf0;text-decoration:none;font-size:13px}.back:hover{text-decoration:underline}.step[hidden]{display:none!important}.foot{text-align:center;color:#667d90;font-size:12px;margin-top:18px}@media(max-width:480px){body{padding:16px}.card{padding:23px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><img class="logo" src="assets/fullbright-logo.jpg" alt="Fullbright College logo"><div><h1>Fullbright College</h1><p>Equipment Borrowing System</p></div></div>
  <section class="card">
    <h2 id="heading">Forgot your password?</h2>
    <p class="sub" id="description">Enter the email address linked to your account. We'll send you a recovery code to verify your identity.</p>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <form id="requestForm" class="step">
      <div class="field"><label for="email">Account email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
      <button id="requestBtn" class="btn" type="submit">Send recovery code</button>
    </form>
    <form id="verifyForm" class="step" hidden>
      <div class="field"><label for="code">Recovery code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter the code from your email" required></div>
      <div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required></div>
      <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Re-enter your new password" required></div>
      <button id="verifyBtn" class="btn" type="submit">Verify code and change password</button>
      <button id="resendBtn" class="btn secondary" type="button">Send a new code</button>
    </form>
    <a class="back" href="./index.html">Return to sign in</a>
  </section>
  <p class="foot">Secure password recovery powered by Supabase Authentication.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Copy the exact project URL and publishable/anon key from assets/app.js. Never use a service-role key here.
const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_PUBLISHABLE_KEY = 'YOUR_SUPABASE_PUBLISHABLE_KEY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);
const statusEl=$('status'), requestForm=$('requestForm'), verifyForm=$('verifyForm');
let requestedEmail='';
function message(text,bad=false){statusEl.textContent=text;statusEl.className='status show '+(bad?'bad':'good')}
function configReady(){if(SUPABASE_URL==='YOUR_SUPABASE_PROJECT_URL'||SUPABASE_PUBLISHABLE_KEY==='YOUR_SUPABASE_PUBLISHABLE_KEY'){message('Setup required: copy the Supabase project URL and publishable/anon key from assets/app.js into this page.',true);return false}return true}
async function requestCode(){if(!configReady())return;const email=$('email').value.trim();if(!email){message('Enter your account email first.',true);return}requestedEmail=email;const btn=$('requestBtn');btn.disabled=true;btn.textContent='Sending code…';const {error}=await sb.auth.resetPasswordForEmail(email);btn.disabled=false;btn.textContent='Send recovery code';if(error){message(error.message,true);return}requestForm.hidden=true;verifyForm.hidden=false;$('heading').textContent='Check your email';$('description').textContent='Enter the recovery code from the email, then choose your new password.';message('If an account exists for that email, a recovery email has been sent. Check your inbox and spam folder.')}
requestForm.addEventListener('submit',async e=>{e.preventDefault();await requestCode()});
$('resendBtn').addEventListener('click',async()=>{if(requestedEmail)$('email').value=requestedEmail;verifyForm.hidden=true;requestForm.hidden=false;$('heading').textContent='Forgot your password?';$('description').textContent="Enter the email address linked to your account. We'll send you a recovery code to verify your identity.";statusEl.className='status';await requestCode()});
verifyForm.addEventListener('submit',async e=>{e.preventDefault();if(!configReady())return;const token=$('code').value.trim().replace(/\s+/g,'');const password=$('newPassword').value;const confirm=$('confirmPassword').value;if(!requestedEmail){message('Request a recovery code first.',true);return}if(!token){message('Enter the recovery code from your email.',true);return}if(password.length<8){message('Your password must contain at least 8 characters.',true);return}if(password!==confirm){message('The passwords do not match.',true);return}const btn=$('verifyBtn');btn.disabled=true;btn.textContent='Verifying…';const {error:verifyError}=await sb.auth.verifyOtp({email:requestedEmail,token,type:'recovery'});if(verifyError){btn.disabled=false;btn.textContent='Verify code and change password';message('Could not verify that code. Check it and try again, or request a new code. '+verifyError.message,true);return}const {error:updateError}=await sb.auth.updateUser({password});btn.disabled=false;btn.textContent='Verify code and change password';if(updateError){message(updateError.message,true);return}verifyForm.hidden=true;$('heading').textContent='Password changed';$('description').textContent='Your password has been updated. Return to sign in using your new password.';message('Password updated successfully.');await sb.auth.signOut()});
if(SUPABASE_URL==='YOUR_SUPABASE_PROJECT_URL'||SUPABASE_PUBLISHABLE_KEY==='YOUR_SUPABASE_PUBLISHABLE_KEY')message('Setup required: copy the Supabase project URL and publishable/anon key from assets/app.js into this page.',true);
</script>
</body>
</html>
