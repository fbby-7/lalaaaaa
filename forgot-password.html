
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d14">
  <title>Forgot Password | Fullbright College</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #080d14;
      --panel: #101b26;
      --field: #09121b;
      --line: #26394b;
      --text: #e8eef6;
      --muted: #91a4b6;
      --accent: #28b6eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 5%, #122b3c 0, transparent 35%),
        var(--bg);
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
    }

    .wrap {
      width: min(100%, 460px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      object-fit: cover;
      background: white;
    }

    .brand h1 {
      font-size: 21px;
      margin: 0 0 5px;
    }

    .brand p {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    .card {
      background: linear-gradient(145deg, #111e2a, #0d151f);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 24px 70px #0007;
    }

    h2 {
      font-size: 24px;
      margin: 0 0 10px;
    }

    .description {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin: 0 0 24px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #b8c7d5;
    }

    input {
      width: 100%;
      padding: 15px;
      background: var(--field);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      font: inherit;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #28b6eb25;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 1px solid #31506a;
      border-radius: 12px;
      background: linear-gradient(100deg, #71d1f4, #28b6eb);
      color: #06111b;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      background: #172737;
      color: var(--text);
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #0d352e;
      color: #a7f3d0;
    }

    .status.error {
      background: #7f1d1d;
      color: #fee2e2;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #8cccf0;
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    [hidden] {
      display: none !important;
    }

    .footer {
      text-align: center;
      color: #667d90;
      font-size: 12px;
      margin-top: 18px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 23px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <div class="brand">
      <img
        class="logo"
        src="assets/fullbright-logo.jpg"
        alt="Fullbright College logo"
      >

      <div>
        <h1>Fullbright College</h1>
        <p>Equipment Borrowing System</p>
      </div>
    </div>

    <section class="card">
      <h2 id="heading">Forgot your password?</h2>

      <p class="description" id="description">
        Enter the email address associated with your account.
        We'll send you a recovery code to verify your identity.
      </p>

      <div
        id="status"
        class="status"
        role="status"
        aria-live="polite"
      ></div>

      <!-- STEP 1: REQUEST CODE -->
      <form id="requestForm">
        <div class="field">
          <label for="email">Account email</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <button id="requestBtn" type="submit">
          Send recovery code
        </button>
      </form>

      <!-- STEP 2: VERIFY CODE AND CHANGE PASSWORD -->
      <form id="verifyForm" hidden>
        <div class="field">
          <label for="code">Recovery code</label>
          <input
            id="code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="Enter the code from your email"
            required
          >
        </div>

        <div class="field">
          <label for="newPassword">New password</label>
          <input
            id="newPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="At least 8 characters"
            required
          >
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input
            id="confirmPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="Re-enter your new password"
            required
          >
        </div>

        <button id="verifyBtn" type="submit">
          Verify code and change password
        </button>

        <button
          id="resendBtn"
          class="secondary"
          type="button"
        >
          Send a new code
        </button>
      </form>

      <a class="back" href="./index.html">
        Return to sign in
      </a>
    </section>

    <p class="footer">
      Secure password recovery powered by Supabase Authentication.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /*
      IMPORTANT:
      Copy your actual Supabase project URL and publishable
      (or legacy anon) key from your existing assets/app.js.

      Never put your service-role key in this file.
    */

    const SUPABASE_URL = "https://uaxfzmtpjcfwfoqhgfih.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_hsippBvYrIczvzTtI8cR2A_dV6eqcUj";

    const sb = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = id => document.getElementById(id);

    const requestForm = $("requestForm");
    const verifyForm = $("verifyForm");
    const statusEl = $("status");

    let requestedEmail = "";

    function showMessage(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className =
        "status show " + (isError ? "error" : "success");
    }

    function clearMessage() {
      statusEl.textContent = "";
      statusEl.className = "status";
    }

    function configReady() {
      if (
        SUPABASE_URL === "YOUR_SUPABASE_PROJECT_URL" ||
        SUPABASE_PUBLISHABLE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
      ) {
        showMessage(
          "Setup required: add your real Supabase project URL and publishable key in this file.",
          true
        );
        return false;
      }

      return true;
    }

    function showRequestStep() {
      requestForm.hidden = false;
      verifyForm.hidden = true;

      $("heading").textContent = "Forgot your password?";
      $("description").textContent =
        "Enter the email address associated with your account. We'll send you a recovery code to verify your identity.";

      clearMessage();
    }

    function showVerifyStep() {
      requestForm.hidden = true;
      verifyForm.hidden = false;

      $("heading").textContent = "Check your email";
      $("description").textContent =
        "Enter the recovery code from your email and choose a new password.";

      clearMessage();
    }

    async function requestCode() {
      if (!configReady()) return;

      const email = $("email").value.trim();

      if (!email) {
        showMessage("Enter your account email first.", true);
        return;
      }

      const btn = $("requestBtn");
      btn.disabled = true;
      btn.textContent = "Sending code...";

      try {
        /*
          Supabase sends the recovery email.
          Configure the Reset Password email template to
          include {{ .Token }} if you want a numeric OTP.
        */
        const { error } =
          await sb.auth.resetPasswordForEmail(email);

        if (error) {
          showMessage(error.message, true);
          return;
        }

        requestedEmail = email;

        showVerifyStep();

        showMessage(
          "If an account exists for this email, a recovery email has been sent. Check your inbox and spam folder."
        );
      } catch (error) {
        showMessage(
          error.message || "Could not request a recovery code.",
          true
        );
      } finally {
        btn.disabled = false;
        btn.textContent = "Send recovery code";
      }
    }

    requestForm.addEventListener("submit", async event => {
      event.preventDefault();
      await requestCode();
    });

    $("resendBtn").addEventListener("click", async () => {
      $("email").value = requestedEmail;
      showRequestStep();
      await requestCode();
    });

    verifyForm.addEventListener("submit", async event => {
      event.preventDefault();

      if (!configReady()) return;

      const token = $("code").value.trim().replace(/\s+/g, "");
      const password = $("newPassword").value;
      const confirmPassword = $("confirmPassword").value;

      if (!requestedEmail) {
        showMessage(
          "Please request a recovery code first.",
          true
        );
        return;
      }

      if (!token) {
        showMessage("Enter the recovery code from your email.", true);
        return;
      }

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          true
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The passwords do not match.", true);
        return;
      }

      const btn = $("verifyBtn");
      btn.disabled = true;
      btn.textContent = "Verifying code...";

      try {
        /*
          Verify the recovery OTP and establish the recovery
          session before changing the password.
        */
        const { error: verifyError } =
          await sb.auth.verifyOtp({
            email: requestedEmail,
            token,
            type: "recovery"
          });

        if (verifyError) {
          showMessage(
            "The recovery code could not be verified. Check the code or request a new one. " +
            verifyError.message,
            true
          );
          return;
        }

        const { error: updateError } =
          await sb.auth.updateUser({
            password
          });

        if (updateError) {
          showMessage(
            "The code was accepted, but the password could not be updated. " +
            updateError.message,
            true
          );
          return;
        }

        verifyForm.hidden = true;

        $("heading").textContent = "Password changed";
        $("description").textContent =
          "Your password has been updated. Return to sign in using your new password.";

        showMessage("Your password was changed successfully.");

        await sb.auth.signOut();

      } catch (error) {
        showMessage(
          error.message || "Something went wrong. Please try again.",
          true
        );
      } finally {
        btn.disabled = false;
        btn.textContent = "Verify code and change password";
      }
    });

    if (
      SUPABASE_URL === "YOUR_SUPABASE_PROJECT_URL" ||
      SUPABASE_PUBLISHABLE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
    ) {
      showMessage(
        "Setup required: add your real Supabase project URL and publishable key in this file.",
        true
      );
    }
  </script>
</body>
</html>
