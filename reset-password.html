<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d14">
<title>Reset Password | Fullbright College</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080d14;--panel:#101b26;--field:#09121b;--line:#26394b;--text:#e8eef6;--muted:#91a4b6;--accent:#28a9e0;--btn:#172737;--good:#0d352e;--bad:#7f1d1d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#122b3c 0,transparent 35%),var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}.wrap{width:min(100%,460px)}.brand{display:flex;align-items:center;gap:13px;margin-bottom:22px}.logo{width:48px;height:48px;border-radius:12px;object-fit:cover}.brand h1{font-size:19px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}.card{background:linear-gradient(145deg,#111e2a,#0d151f);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 24px 70px #0007}.card h2{font-size:23px;margin:0 0 9px}.sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 24px}.field{margin-bottom:18px}.field label{display:block;font-size:13px;font-weight:700;color:#b8c7d5;margin-bottom:8px}.pw{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--field);border-radius:13px;padding-right:8px}.pw:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #28a9e033}.pw input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);padding:15px;font:inherit}.toggle{border:0;background:transparent;color:#9fb7c9;padding:8px;cursor:pointer}.btn{width:100%;border:1px solid #31506a;background:var(--btn);color:var(--text);font:inherit;font-weight:750;border-radius:12px;padding:14px;cursor:pointer}.btn:hover{border-color:var(--accent)}.btn:disabled{opacity:.65;cursor:wait}.status{display:none;border-radius:10px;padding:12px 14px;margin:0 0 18px;font-size:13px;line-height:1.5}.status.show{display:block}.status.good{background:var(--good);color:#a7f3d0}.status.bad{background:var(--bad);color:#fee2e2}.back{display:block;text-align:center;margin-top:19px;color:#8cccf0;text-decoration:none;font-size:13px}.back:hover{text-decoration:underline}.foot{text-align:center;color:#667d90;font-size:12px;margin-top:18px}@media(max-width:480px){body{padding:16px}.card{padding:23px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><img class="logo" src="assets/fullbright-logo.jpg" alt="Fullbright College logo"><div><h1>Fullbright College</h1><p>Equipment Borrowing System</p></div></div>
  <section class="card">
    <h2>Set a new password</h2>
    <p class="sub">Choose a new password for your account. This page is separate from the borrowing dashboard.</p>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <form id="resetForm" hidden>
      <div class="field"><label for="password">New password</label><div class="pw"><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required><button class="toggle" type="button" data-for="password">Show</button></div></div>
      <div class="field"><label for="confirm">Confirm new password</label><div class="pw"><input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Re-enter new password" required><button class="toggle" type="button" data-for="confirm">Show</button></div></div>
      <button id="submit" class="btn" type="submit">Update Password</button>
    </form>
    <a class="back" href="./index.html">Return to sign in</a>
  </section>
  <p class="foot">Secure password recovery powered by Supabase Authentication.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Keep these two values identical to assets/app.js. Use only the Supabase publishable/anon key here.
const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_PUBLISHABLE_KEY = 'YOUR_SUPABASE_PUBLISHABLE_KEY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const statusEl=document.getElementById('status'),form=document.getElementById('resetForm'),submit=document.getElementById('submit');
function message(text,bad=false){statusEl.textContent=text;statusEl.className='status show '+(bad?'bad':'good')}
document.querySelectorAll('.toggle').forEach(b=>b.addEventListener('click',()=>{const input=document.getElementById(b.dataset.for);input.type=input.type==='password'?'text':'password';b.textContent=input.type==='password'?'Show':'Hide';input.focus()}));
let ready=false;
async function initialize(){
  if(SUPABASE_URL==='YOUR_SUPABASE_PROJECT_URL'||SUPABASE_PUBLISHABLE_KEY==='YOUR_SUPABASE_PUBLISHABLE_KEY'){message('Supabase configuration is missing. Add the same project URL and publishable key used by the main website.',true);return}
  const hash=new URLSearchParams(location.hash.slice(1));
  const query=new URLSearchParams(location.search);
  const code=query.get('code');
  if(code){const {error}=await sb.auth.exchangeCodeForSession(code);if(error){message('This reset link is invalid or expired. Request a new password reset email.',true);return}}
  const {data:{session},error}=await sb.auth.getSession();
  if(error||!session){message('This reset link is invalid, expired, or already used. Return to sign in and request a new reset email.',true);return}
  ready=true;form.hidden=false;message('Reset link verified. Enter your new password below.');
  history.replaceState({},document.title,location.pathname);
}
form.addEventListener('submit',async e=>{e.preventDefault();if(!ready)return;const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8){message('Your password must contain at least 8 characters.',true);return}if(p!==c){message('The passwords do not match.',true);return}submit.disabled=true;submit.textContent='Updating…';const {error}=await sb.auth.updateUser({password:p});submit.disabled=false;submit.textContent='Update Password';if(error){message(error.message,true);return}form.hidden=true;message('Password updated successfully. You can now sign in using your new password.');await sb.auth.signOut();});
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session&&!ready){ready=true;form.hidden=false;message('Reset link verified. Enter your new password below.')}});
initialize();
</script>
</body>
</html>
