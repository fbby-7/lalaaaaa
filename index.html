<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d14">
<meta name="description" content="Fullbright College Equipment Borrowing System for managing equipment inventory, borrowing requests, returns, and maintenance.">
<title>Fullbright College | Equipment Borrowing System</title>
<link rel="icon" href="assets/fullbright-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<section id="authView" class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <img class="school-logo" src="assets/fullbright-logo.jpg" alt="Fullbright College logo">
      <div><h1>Fullbright College</h1><p>Equipment Borrowing System</p></div>
    </div>
    <div class="tabs"><button class="tab active" data-tab="login">Sign In</button><button class="tab" data-tab="signup">Create Account</button></div>
    <form id="loginForm" class="auth-form">
      <input id="loginEmail" type="email" placeholder="Email" required>
      <input id="loginPassword" type="password" placeholder="Password" required>
      <button class="primary big-btn">Sign In</button>
      <button type="button" class="btn"
  onclick="sendPasswordReset('login')">
  Forgot password?
</button>
    </form>
    <form id="signupForm" class="auth-form hidden">
      <div class="grid2"><input id="firstName" placeholder="First name" required><input id="lastName" placeholder="Last name" required></div>
      <input id="studentId" placeholder="Student/Employee ID" required>
      <input id="signupEmail" type="email" placeholder="Email" required>
      <input id="signupPassword" type="password" minlength="6" placeholder="Password (6+ characters)" required>
      <input id="signupCourse" placeholder="Section / Year (e.g. IT1A)" required>
      <button class="primary big-btn">Create Account</button>
    </form>
    <p class="hint">Accounts are securely handled by Supabase. New accounts start as Student and can be promoted by an administrator.</p>
  </div>
</section>

<section id="appView" class="app hidden">
  <aside>
    <div class="sidebrand"><img class="side-logo" src="assets/fullbright-logo.jpg" alt=""><div><strong>Fullbright College</strong><small>Equipment Borrowing</small></div></div>
    <nav aria-label="Main navigation">
      <button data-page="dashboard" class="nav active">▦ <span>Dashboard</span></button>
      <button data-page="equipment" class="nav">▣ <span>Equipment</span></button>
      <button data-page="borrow" class="nav borrower-only">↗ <span>Borrow Equipment</span></button>
      <button data-page="transactions" class="nav">↺ <span>Transactions</span></button>
      <button data-page="maintenance" class="nav staff-only">⚙ <span>Maintenance</span></button>
      <button data-page="users" class="nav admin-only">♙ <span>User Management</span></button>
      <button data-page="reports" class="nav staff-only">▤ <span>Reports</span></button>
      <button data-page="profile" class="nav">◎ <span>My Profile</span></button>
    </nav>
    <button id="logout" class="logout">⇥ Sign out</button>
  </aside>
  <main>
    <header>
      <div><h2 id="pageTitle">Dashboard</h2><p id="welcome">Welcome</p></div>
      <button class="notification-btn" id="notificationBtn" type="button" aria-label="Toggle notifications" aria-expanded="false">🔔 <span id="notificationCount" class="notification-count">0</span></button>
      <div class="user-chip" id="userChip"></div>
    </header>
    <div id="notificationPanel" class="notification-panel hidden"></div>
    <div id="content"></div>
  </main>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
